<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="my_appointment">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>my_appointment</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Earlier versions of this dashboard installed a service worker that kept
    // serving the old app from its own cache, so updates didn't show even
    // after a reload. Once per browser: remove any service worker and its
    // caches, then reload if anything old was found.
    (function () {
      var KEY = 'dashboard-sw-cleanup-v1';
      try {
        if (localStorage.getItem(KEY)) return;
        localStorage.setItem(KEY, '1');
      } catch (e) {
        return;
      }
      var regsPromise = 'serviceWorker' in navigator
        ? navigator.serviceWorker.getRegistrations()
        : Promise.resolve([]);
      var keysPromise = window.caches ? caches.keys() : Promise.resolve([]);
      Promise.all([regsPromise, keysPromise]).then(function (found) {
        var regs = found[0], keys = found[1];
        if (!regs.length && !keys.length) return;
        return Promise.all(
          regs.map(function (r) { return r.unregister(); })
            .concat(keys.map(function (k) { return caches.delete(k); }))
        ).then(function () { location.reload(); });
      }).catch(function () {});
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
